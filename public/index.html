<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#020617" />
    <meta
      name="description"
      content="Web app that solves and lets you play Mondrian Blocks puzzles."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Mondrian Blocks Solver & Puzzle Game</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Outfit', 'sans-serif'],
            },
            boxShadow: {
              'glow-cyan': '0 0 15px rgba(6, 182, 212, 0.4)',
              'glow-red': '0 0 15px rgba(239, 68, 68, 0.4)',
              'glow-green': '0 0 15px rgba(16, 185, 129, 0.4)',
              'inner-deep': 'inset 0 4px 12px 0 rgba(0, 0, 0, 0.6)',
              'inner-light': 'inset 0 2px 6px 0 rgba(0, 0, 0, 0.1)',
            }
          }
        }
      }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom styles for Mondrian Blocks -->
    <style>
      .block-3d {
        box-shadow: 
          inset 2px 2px 0px rgba(255, 255, 255, 0.35),
          inset -2px -2px 0px rgba(0, 0, 0, 0.4),
          0 4px 6px -1px rgba(0, 0, 0, 0.2), 
          0 2px 4px -1px rgba(0, 0, 0, 0.1);
      }
      
      .block-3d-locked {
        box-shadow: 
          inset 1px 1px 0px rgba(255, 255, 255, 0.15),
          inset -1px -1px 0px rgba(0, 0, 0, 0.5),
          0 2px 4px rgba(0, 0, 0, 0.4);
      }

      @keyframes pulse-outline {
        0%, 100% { outline-color: rgba(6, 182, 212, 0.4); outline-offset: 2px; }
        50% { outline-color: rgba(6, 182, 212, 0.9); outline-offset: 4px; }
      }
      .pulse-target {
        animation: pulse-outline 2s infinite;
        outline: 2px dashed;
      }

      .custom-scroll::-webkit-scrollbar {
        height: 8px;
        width: 8px;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1);
        border-radius: 4px;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background: rgba(156, 163, 175, 0.5);
        border-radius: 4px;
      }
      .custom-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(156, 163, 175, 0.8);
      }

      * {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      .placed-piece-element {
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
